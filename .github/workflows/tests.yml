# Runs the test suite on every push, so a broken commit is obvious long before
# anyone tags a release.
#
# The release workflow runs these too, but only on a tag - which is how a
# missing data file once got as far as a tagged build before anything
# complained.

name: Tests

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run the tests
        run: dotnet test app/SpikeSight.sln -c Release --nologo
