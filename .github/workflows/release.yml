# Builds the release on GitHub's own machines and publishes it.
#
# The point is that nobody has to trust a binary somebody uploaded from their
# desktop. GitHub builds it from the tagged source, signs a provenance
# attestation saying exactly which commit and which workflow produced the
# file, and anyone can check that with `gh attestation verify`. That is a much
# stronger answer to "is this safe" than a virus scan, which can only say that
# nothing recognised it.
#
# It runs app/build.ps1 rather than its own publish command, so the file
# people download is built the same way as the one built on a desk. Two
# recipes for one artifact is how they drift.
#
# Tag a release to run it:  git tag v3.0.0-preview && git push origin v3.0.0-preview

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The tag names the release; the csproj names the file inside it. If
      # they disagree, the download is called something the release is not.
      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $csproj = 'app/SpikeSight.App/SpikeSight.App.csproj'
          $version = ([xml](Get-Content $csproj)).Project.PropertyGroup.Version |
                     Where-Object { $_ }
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME says $tag, $csproj says $version."
          }
          "Both say $version."

      # Runs the tests itself and refuses to package if they fail.
      - name: Build
        shell: pwsh
        run: .\app\build.ps1

      - name: Attest that this workflow built these files
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: app/dist/SpikeSight-*-windows.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = (Get-ChildItem app/dist/SpikeSight-*-windows.zip)[0]
          $sum = (Get-Content app/dist/SHA256SUMS.txt).Split(' ')[0]
          $notes = @"
          ### Verifying this download

          ``````
          Get-FileHash .\$($zip.Name) -Algorithm SHA256
          ``````

          Should print ``$sum``.

          Built by GitHub Actions from ``$env:GITHUB_SHA``. To check that
          cryptographically rather than taking this file's word for it:

          ``````
          gh attestation verify .\$($zip.Name) --repo $env:GITHUB_REPOSITORY
          ``````
          "@
          $release = @($env:GITHUB_REF_NAME, $zip, 'app/dist/SHA256SUMS.txt',
                    '--title', $env:GITHUB_REF_NAME, '--notes', $notes)
          # Anything with a suffix - preview, rc, beta - is not a final
          # release. Appended to the array rather than passed as a variable
          # that might be empty, which gh would see as a blank argument.
          if ($env:GITHUB_REF_NAME -match '-') { $release += '--prerelease' }
          gh release create @release
